<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halloween</title>

    <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet">

    <style>
        body {
            background-color: #ffe6f0;
            font-family: 'Comic Neue', sans-serif;
            margin: 0;
            overflow: hidden;
        }

        /* Màn hình hỏi */
        .overlay {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.5);
            z-index: 2;
        }

        .overlay-body {
            background: #fff7fa;
            padding: 25px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0,0,0,.2);
        }

        .overlay-title {
            font-size: 24px;
            color: #ff6f91;
        }

        .warning {
            color: red;
            font-weight: bold;
            font-size: 14px;
            margin: 15px;
        }

        .overlay-button {
            background: #ffb3c1;
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 20px;
            cursor: pointer;
            margin: 5px;
            font-size: 16px;
        }

        .overlay-button:hover {
            background: #ff8c9f;
        }


        /* Video hù */
        .scare {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 1;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

    </style>

</head>


<body>


<div id="overlay" class="overlay">

    <div class="overlay-body">

        <p class="overlay-title">
            🎃 ¿Quieres celebrar Halloween conmigo?
        </p>


        <p class="warning">
             This is not the original.
                           <br>
           This is the edited version..
                            <br>
        The original is here: https://jonathanbassedas.github.io/halloween/
        </p>


        <button id="accept-button" class="overlay-button">
            🎃 Si
        </button>


        <button id="decline-button" class="overlay-button">
            🕸 No
        </button>


    </div>

</div>



<div id="scare" class="scare">

    <video id="video" src="haha.mp4"></video>

</div>



<script>

const video = document.getElementById("video");
const overlay = document.getElementById("overlay");
const scare = document.getElementById("scare");

const acceptButton = document.getElementById("accept-button");
const declineButton = document.getElementById("decline-button");


function startVideo(){

    overlay.style.display = "none";

    scare.style.display = "block";

    video.play();

}


acceptButton.addEventListener("click", startVideo);

declineButton.addEventListener("click", startVideo);


</script>


</body>

</html>
